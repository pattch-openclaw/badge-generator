<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            width: 100%;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .pattern-editor {
            flex: 0 0 auto;
        }

        .preview {
            flex: 0 0 auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cccccc;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            resize: vertical;
            font-family: monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
        }

        select:focus, input[type="range"]:focus {
            outline: none;
            border-color: #666;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background-color: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
        }

        .range-value {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .generate-btn {
            background-color: #4a9eff;
            color: white;
            width: 100%;
            margin-bottom: 15px;
        }

        .generate-btn:hover {
            background-color: #3a8eff;
        }

        .download-btn {
            background-color: #4caf50;
            color: white;
            width: 100%;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        .download-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .badge-container {
            position: relative;
            background-color: #000000;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 1px solid #333;
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
            cursor: crosshair;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* Pattern editor styles */
        .pattern-editor-container {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }

        .pattern-title {
            margin-bottom: 15px;
            font-weight: 500;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(16, 20px);
            grid-template-rows: repeat(16, 20px);
            gap: 2px;
            margin: 0 auto;
            background-color: #1a1a1a;
            padding: 5px;
            border-radius: 4px;
        }

        .grid-cell {
            width: 20px;
            height: 20px;
            background-color: #000000;
            border: 1px solid #333;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .grid-cell.active {
            background-color: #ffffff;
            border-color: #666;
        }

        .pattern-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .pattern-btn {
            padding: 8px 16px;
            font-size: 14px;
        }

        .pattern-btn.clear {
            background-color: #d32f2f;
        }

        .pattern-btn.clear:hover {
            background-color: #c62828;
        }

        .pattern-btn.random {
            background-color: #ff9800;
        }

        .pattern-btn.random:hover {
            background-color: #f57c00;
        }

        .pattern-btn.invert {
            background-color: #9c27b0;
        }

        .pattern-btn.invert:hover {
            background-color: #8e24aa;
        }
    </style>
</head>
<body>
    <h1>Badge Generator</h1>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="badgeText">Badge Text</label>
                <textarea id="badgeText" placeholder="Enter your badge text here...">Hello World</textarea>
                <p class="hint">This text will be displayed on the badge</p>
            </div>
            
            <div class="control-group">
                <label for="fontFamily">Font Family</label>
                <select id="fontFamily">
                    <option value="monospace">Monospace</option>
                    <option value="sans-serif">Sans Serif</option>
                    <option value="serif">Serif</option>
                    <option value="system-ui">System UI</option>
                    <option value="courier, monospace">Courier New</option>
                    <option value="times new roman, serif">Times New Roman</option>
                    <option value="arial, sans-serif">Arial</option>
                    <option value="verdana, sans-serif">Verdana</option>
                    <option value="georgia, serif">Georgia</option>
                    <option value="trebuchet ms, sans-serif">Trebuchet MS</option>
                    <option value="helvetica, sans-serif">Helvetica</option>
                    <option value="comic sans ms, cursive">Comic Sans MS</option>
                    <option value="impact, sans-serif">Impact</option>
                    <option value="lucida console, monospace">Lucida Console</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="fontSize">Font Size</label>
                <input type="range" id="fontSize" min="10" max="60" value="24">
                <p class="range-value" id="fontSizeValue">24px</p>
            </div>
            
            <button class="generate-btn" id="generateBtn">Generate Preview</button>
            
            <button class="download-btn" id="downloadBtn" disabled>Download Badge (PNG)</button>
        </div>
        
        <div class="pattern-editor">
            <div class="pattern-editor-container">
                <div class="pattern-title">Pattern Editor (16x16)</div>
                <div class="pattern-grid" id="patternGrid"></div>
                <div class="pattern-controls">
                    <button class="pattern-btn clear" id="clearBtn">Clear</button>
                    <button class="pattern-btn random" id="randomBtn">Random</button>
                    <button class="pattern-btn invert" id="invertBtn">Invert</button>
                </div>
                <p class="hint">Click cells to toggle them. The pattern will be repeated to fill the badge background.</p>
            </div>
        </div>
        
        <div class="preview">
            <div class="badge-container">
                <canvas id="badgeCanvas" width="128" height="128"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('badgeCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const badgeText = document.getElementById('badgeText');
        const fontFamilySelect = document.getElementById('fontFamily');
        const fontSizeInput = document.getElementById('fontSize');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const patternGrid = document.getElementById('patternGrid');

        // Badge configuration
        const CANVAS_SIZE = 128;
        const FONT_COLOR = '#ffffff';
        const BACKGROUND_COLOR = '#000000';
        const GRID_SIZE = 16;

        // Pattern state - 16x16 grid of 0s and 1s
        let pattern = Array(GRID_SIZE * GRID_SIZE).fill(0);

        // Initialize pattern grid
        function initPatternGrid() {
            patternGrid.innerHTML = '';
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.dataset.index = i;
                if (pattern[i] === 1) {
                    cell.classList.add('active');
                }
                cell.addEventListener('mousedown', handleGridClick);
                cell.addEventListener('mouseenter', handleGridHover);
                patternGrid.appendChild(cell);
            }
        }

        // Handle grid cell clicks
        let isMouseDown = false;
        let dragMode = 'toggle'; // 'toggle', 'setActive', 'setInactive'

        document.addEventListener('mousedown', () => { isMouseDown = true; });
        document.addEventListener('mouseup', () => { isMouseDown = false; });

        function handleGridClick(e) {
            const index = parseInt(e.target.dataset.index);
            if (pattern[index] === 1) {
                pattern[index] = 0;
                e.target.classList.remove('active');
            } else {
                pattern[index] = 1;
                e.target.classList.add('active');
            }
            generatePreview();
        }

        function handleGridHover(e) {
            if (isMouseDown) {
                const index = parseInt(e.target.dataset.index);
                pattern[index] = 1;
                e.target.classList.add('active');
                generatePreview();
            }
        }

        // Pattern actions
        document.getElementById('clearBtn').addEventListener('click', () => {
            pattern = pattern.map(() => 0);
            initPatternGrid();
            generatePreview();
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            pattern = pattern.map(() => Math.random() > 0.5 ? 1 : 0);
            initPatternGrid();
            generatePreview();
        });

        document.getElementById('invertBtn').addEventListener('click', () => {
            pattern = pattern.map(p => p === 1 ? 0 : 1);
            initPatternGrid();
            generatePreview();
        });

        // Pattern drawing functions
        function drawPattern() {
            const tileSize = 8; // 16x8 = 128px tiles
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (pattern[y * GRID_SIZE + x] === 1) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
                    }
                }
            }
        }

        function drawBadge(text) {
            // Get current settings
            const fontFamily = fontFamilySelect.value;
            const fontSize = parseInt(fontSizeInput.value);

            // Clear canvas with black background
            ctx.fillStyle = BACKGROUND_COLOR;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw pattern background
            drawPattern();

            // Calculate optimal font size
            const autoFontSize = calculateOptimalFontSize(text, fontFamily, CANVAS_SIZE);
            const finalFontSize = Math.min(fontSize, autoFontSize);

            // Set up text styling
            ctx.font = `bold ${finalFontSize}px ${fontFamily}`;
            ctx.fillStyle = FONT_COLOR;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Handle multi-line text
            const lines = text.split('\n');
            const lineHeight = finalFontSize * 1.4;
            const totalHeight = lines.length * lineHeight;
            const startY = (CANVAS_SIZE - totalHeight) / 2 + finalFontSize / 2;

            lines.forEach((line, index) => {
                const y = startY + index * lineHeight;
                const x = CANVAS_SIZE / 2;

                // Add slight text shadow for better visibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                ctx.fillText(line, x, y);
                
                // Reset shadow
                ctx.shadowColor = 'transparent';
            });
        }

        function calculateOptimalFontSize(text, fontFamily, maxSize) {
            // Start with large font and scale down
            let fontSize = 60;
            ctx.font = `bold ${fontSize}px ${fontFamily}`;

            const lines = text.split('\n');
            const maxLineWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
            const maxLines = lines.length;

            // Check if text is too wide or too tall
            const widthRatio = maxSize / maxLineWidth;
            const heightRatio = maxSize / (maxLines * fontSize * 1.4);

            return Math.floor(Math.min(60, widthRatio * fontSize, heightRatio * fontSize));
        }

        function generatePreview() {
            const text = badgeText.value;
            drawBadge(text);
            
            // Enable download button if there's text
            downloadBtn.disabled = !text.trim();
        }

        function downloadBadge() {
            const text = badgeText.value;
            if (!text.trim()) return;

            drawBadge(text);
            
            // Generate download
            const link = document.createElement('a');
            link.download = `badge-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Event listeners
        generateBtn.addEventListener('click', generatePreview);
        downloadBtn.addEventListener('click', downloadBadge);
        
        // Font family change
        fontFamilySelect.addEventListener('change', generatePreview);
        
        // Font size change
        fontSizeInput.addEventListener('input', () => {
            fontSizeValue.textContent = `${fontSizeInput.value}px`;
            generatePreview();
        });
        
        // Auto-generate on text change (debounced)
        let debounceTimer;
        badgeText.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generatePreview, 300);
        });

        // Initial setup
        initPatternGrid();
        generatePreview();
    </script>
</body>
</html>
