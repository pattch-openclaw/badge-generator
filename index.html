<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .preview {
            flex: 0 0 auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cccccc;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            resize: vertical;
            font-family: monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .generate-btn {
            background-color: #4a9eff;
            color: white;
            width: 100%;
            margin-bottom: 15px;
        }

        .generate-btn:hover {
            background-color: #3a8eff;
        }

        .download-btn {
            background-color: #4caf50;
            color: white;
            width: 100%;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        .download-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .badge-container {
            position: relative;
            background-color: #000000;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 200px;
            min-height: 200px;
        }

        canvas {
            border: 1px solid #333;
            max-width: 100%;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Badge Generator</h1>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="badgeText">Badge Text</label>
                <textarea id="badgeText" placeholder="Enter your badge text here...">Hello World</textarea>
                <p class="hint">This text will be displayed on the badge</p>
            </div>
            
            <button class="generate-btn" id="generateBtn">Generate Preview</button>
            
            <button class="download-btn" id="downloadBtn" disabled>Download Badge (PNG)</button>
        </div>
        
        <div class="preview">
            <div class="badge-container">
                <canvas id="badgeCanvas" width="320" height="320"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('badgeCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const badgeText = document.getElementById('badgeText');

        // Default white font on black background
        const FONT_FAMILY = 'monospace';
        const FONT_SIZE = 24;
        const FONT_COLOR = '#ffffff';
        const BACKGROUND_COLOR = '#000000';

        function drawBadge(text) {
            // Clear canvas with black background
            ctx.fillStyle = BACKGROUND_COLOR;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate text dimensions and position
            ctx.font = `bold ${FONT_SIZE}px ${FONT_FAMILY}`;
            ctx.fillStyle = FONT_COLOR;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Handle multi-line text
            const lines = text.split('\n');
            const lineHeight = FONT_SIZE * 1.4;
            const totalHeight = lines.length * lineHeight;
            const startY = (canvas.height - totalHeight) / 2 + FONT_SIZE / 2;

            lines.forEach((line, index) => {
                const y = startY + index * lineHeight;
                const lineWidth = ctx.measureText(line).width;
                const x = canvas.width / 2;

                // Add slight text shadow for better visibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.fillText(line, x, y);
                
                // Reset shadow
                ctx.shadowColor = 'transparent';
            });
        }

        function generatePreview() {
            const text = badgeText.value;
            drawBadge(text);
            
            // Enable download button if there's text
            downloadBtn.disabled = !text.trim();
        }

        function downloadBadge() {
            const text = badgeText.value;
            if (!text.trim()) return;

            drawBadge(text);
            
            // Generate download
            const link = document.createElement('a');
            link.download = `badge-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Event listeners
        generateBtn.addEventListener('click', generatePreview);
        downloadBtn.addEventListener('click', downloadBadge);
        
        // Auto-generate on text change (debounced)
        let debounceTimer;
        badgeText.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generatePreview, 300);
        });

        // Initial generation
        generatePreview();
    </script>
</body>
</html>
