<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .controls {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .preview {
            flex: 0 0 auto;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cccccc;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
            resize: vertical;
            font-family: monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
        }

        select:focus, input[type="range"]:focus {
            outline: none;
            border-color: #666;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background-color: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
        }

        .range-value {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .generate-btn {
            background-color: #4a9eff;
            color: white;
            width: 100%;
            margin-bottom: 15px;
        }

        .generate-btn:hover {
            background-color: #3a8eff;
        }

        .download-btn {
            background-color: #4caf50;
            color: white;
            width: 100%;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        .download-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .badge-container {
            position: relative;
            background-color: #000000;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            border: 1px solid #333;
            width: 128px;
            height: 128px;
            image-rendering: pixelated;
        }

        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Badge Generator</h1>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="badgeText">Badge Text</label>
                <textarea id="badgeText" placeholder="Enter your badge text here...">Hello World</textarea>
                <p class="hint">This text will be displayed on the badge</p>
            </div>
            
            <div class="control-group">
                <label for="fontFamily">Font Family</label>
                <select id="fontFamily">
                    <option value="monospace">Monospace</option>
                    <option value="sans-serif">Sans Serif</option>
                    <option value="serif">Serif</option>
                    <option value="system-ui">System UI</option>
                    <option value="courier, monospace">Courier New</option>
                    <option value="times new roman, serif">Times New Roman</option>
                    <option value="arial, sans-serif">Arial</option>
                    <option value="verdana, sans-serif">Verdana</option>
                    <option value="georgia, serif">Georgia</option>
                    <option value="trebuchet ms, sans-serif">Trebuchet MS</option>
                    <option value="helvetica, sans-serif">Helvetica</option>
                    <option value="comic sans ms, cursive">Comic Sans MS</option>
                    <option value="impact, sans-serif">Impact</option>
                    <option value="lucida console, monospace">Lucida Console</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="fontSize">Font Size</label>
                <input type="range" id="fontSize" min="10" max="60" value="24">
                <p class="range-value" id="fontSizeValue">24px</p>
            </div>
            
            <button class="generate-btn" id="generateBtn">Generate Preview</button>
            
            <button class="download-btn" id="downloadBtn" disabled>Download Badge (PNG)</button>
        </div>
        
        <div class="preview">
            <div class="badge-container">
                <canvas id="badgeCanvas" width="128" height="128"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('badgeCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const badgeText = document.getElementById('badgeText');
        const fontFamilySelect = document.getElementById('fontFamily');
        const fontSizeInput = document.getElementById('fontSize');
        const fontSizeValue = document.getElementById('fontSizeValue');

        // Badge configuration
        const CANVAS_SIZE = 128;
        const FONT_COLOR = '#ffffff';
        const BACKGROUND_COLOR = '#000000';

        function drawBadge(text) {
            // Get current settings
            const fontFamily = fontFamilySelect.value;
            const fontSize = parseInt(fontSizeInput.value);

            // Clear canvas with black background
            ctx.fillStyle = BACKGROUND_COLOR;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Calculate optimal font size if auto-sizing
            const autoFontSize = calculateOptimalFontSize(text, fontFamily, CANVAS_SIZE);
            const finalFontSize = Math.min(fontSize, autoFontSize);

            // Set up text styling
            ctx.font = `bold ${finalFontSize}px ${fontFamily}`;
            ctx.fillStyle = FONT_COLOR;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Handle multi-line text
            const lines = text.split('\n');
            const lineHeight = finalFontSize * 1.4;
            const totalHeight = lines.length * lineHeight;
            const startY = (CANVAS_SIZE - totalHeight) / 2 + finalFontSize / 2;

            lines.forEach((line, index) => {
                const y = startY + index * lineHeight;
                const x = CANVAS_SIZE / 2;

                // Add slight text shadow for better visibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 2;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                ctx.fillText(line, x, y);
                
                // Reset shadow
                ctx.shadowColor = 'transparent';
            });
        }

        function calculateOptimalFontSize(text, fontFamily, maxSize) {
            // Start with large font and scale down
            let fontSize = 60;
            ctx.font = `bold ${fontSize}px ${fontFamily}`;

            const lines = text.split('\n');
            const maxLineWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
            const maxLines = lines.length;

            // Check if text is too wide or too tall
            const widthRatio = maxSize / maxLineWidth;
            const heightRatio = maxSize / (maxLines * fontSize * 1.4);

            return Math.floor(Math.min(60, widthRatio * fontSize, heightRatio * fontSize));
        }

        function generatePreview() {
            const text = badgeText.value;
            drawBadge(text);
            
            // Enable download button if there's text
            downloadBtn.disabled = !text.trim();
        }

        function downloadBadge() {
            const text = badgeText.value;
            if (!text.trim()) return;

            drawBadge(text);
            
            // Generate download
            const link = document.createElement('a');
            link.download = `badge-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Event listeners
        generateBtn.addEventListener('click', generatePreview);
        downloadBtn.addEventListener('click', downloadBadge);
        
        // Font family change
        fontFamilySelect.addEventListener('change', generatePreview);
        
        // Font size change
        fontSizeInput.addEventListener('input', () => {
            fontSizeValue.textContent = `${fontSizeInput.value}px`;
            generatePreview();
        });
        
        // Auto-generate on text change (debounced)
        let debounceTimer;
        badgeText.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generatePreview, 300);
        });

        // Initial generation
        generatePreview();
    </script>
</body>
</html>
